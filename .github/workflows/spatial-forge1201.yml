name: Spatial Client Forge 1.20.1

on:
  push:
    branches: [spatial-client-forge1201]
    paths:
      - 'spatial-forge1201/**'
      - '.github/workflows/spatial-forge1201.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build Spatial Client
        working-directory: spatial-forge1201
        run: gradle clean build --no-daemon --stacktrace

      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libxrandr2 libxinerama1 libxcursor1 libxi6 libasound2t64

      - name: Boot Forge, create a world, and exercise Spatial Client
        working-directory: spatial-forge1201
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s gradle runClient -PsmokeTest --no-daemon --stacktrace
          grep -q SPATIALCLIENT_SMOKE_WORLD_READY run/logs/latest.log
          grep -q SPATIALCLIENT_SMOKE_UI_OPEN run/logs/latest.log
          test "$(grep -c SPATIALCLIENT_SMOKE_PAGE_OK run/logs/latest.log)" -eq 6
          test "$(grep -c SPATIALCLIENT_SMOKE_AURA_OK run/logs/latest.log)" -eq 9
          grep -q SPATIALCLIENT_SMOKE_CAMERA_RESTORE_OK run/logs/latest.log
          grep -q SPATIALCLIENT_SMOKE_OK run/logs/latest.log
          test "$(find run -maxdepth 1 -name 'spatialclient-*.png' | wc -l)" -ge 16

      - name: Upload tested mod
        uses: actions/upload-artifact@v4
        with:
          name: SpatialClient-Forge-1.20.1
          path: |
            spatial-forge1201/build/libs/*.jar
            !spatial-forge1201/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpatialClient-smoke-evidence
          path: |
            spatial-forge1201/run/spatialclient-*.png
            spatial-forge1201/run/logs/latest.log
          if-no-files-found: warn

  compatibility-smoke:
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libxrandr2 libxinerama1 libxcursor1 libxi6 libasound2t64

      - name: Download representative Forge 1.20.1 mod stack
        working-directory: spatial-forge1201
        run: |
          mkdir -p run/mods
          python - <<'PY'
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          projects = ["embeddium", "jei", "jade", "appleskin"]
          out = pathlib.Path("run/mods")
          headers = {"User-Agent": "SpatialClient-CI/1.0 (compatibility testing)"}

          for project in projects:
              params = urllib.parse.urlencode({
                  "loaders": json.dumps(["forge"]),
                  "game_versions": json.dumps(["1.20.1"]),
              })
              req = urllib.request.Request(
                  f"https://api.modrinth.com/v2/project/{project}/version?{params}",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  versions = json.load(response)
              if not versions:
                  raise RuntimeError(f"No Forge 1.20.1 version found for {project}")
              files = versions[0]["files"]
              selected = next((f for f in files if f.get("primary")), files[0])
              target = out / selected["filename"]
              req = urllib.request.Request(selected["url"], headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response, target.open("wb") as dest:
                  dest.write(response.read())
              print(project, "->", target.name)
          PY

      - name: Run Spatial world smoke with common mods
        working-directory: spatial-forge1201
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s gradle runClient -PsmokeTest --no-daemon --stacktrace
          grep -q SPATIALCLIENT_SMOKE_WORLD_READY run/logs/latest.log
          test "$(grep -c SPATIALCLIENT_SMOKE_PAGE_OK run/logs/latest.log)" -eq 6
          test "$(grep -c SPATIALCLIENT_SMOKE_AURA_OK run/logs/latest.log)" -eq 9
          grep -q SPATIALCLIENT_SMOKE_CAMERA_RESTORE_OK run/logs/latest.log
          grep -q SPATIALCLIENT_SMOKE_OK run/logs/latest.log

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpatialClient-compatibility-evidence
          path: |
            spatial-forge1201/run/spatialclient-*.png
            spatial-forge1201/run/logs/latest.log
            spatial-forge1201/run/mods/*.jar
          if-no-files-found: warn
