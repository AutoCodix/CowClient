name: Spatial Modern Fabric Build

on:
  push:
    branches:
      - spatial-major-polish-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build and test Spatial Fabric 1.21.11
        working-directory: client
        run: gradle clean test build --no-daemon --stacktrace

      - name: Smoke-test menu in Minecraft
        working-directory: client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libxrandr2 libxinerama1 libxcursor1 libxi6 libasound2t64
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 240s gradle runClient -PsmokeTest --no-daemon
          test -f run/cowclient-smoke.png
          grep -q COWCLIENT_SMOKE_OK run/logs/latest.log

      - name: Verify artifact
        working-directory: client
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SpatialClient-*.jar' ! -name '*sources*' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'dev/cowclient/ui/AccountScreen.class'
          jar tf "$JAR" | grep -q 'dev/cowclient/core/LocalAccount.class'
          jar tf "$JAR" | grep -q 'dev/cowclient/ui/CowScreen.class'
          echo "$JAR"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpatialClient-Fabric-1.21.11-runtime-check
          path: |
            client/run/cowclient-smoke.png
            client/run/logs/latest.log

      - uses: actions/upload-artifact@v4
        with:
          name: SpatialClient-Fabric-1.21.11
          path: client/build/libs/SpatialClient-0.2.0-spatial.jar
          if-no-files-found: error
