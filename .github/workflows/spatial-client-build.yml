name: Spatial Client Forge Build

on:
  push:
    branches:
      - spatial-forge-1.20.1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract Spatial Client
        run: |
          rm -rf SpatialClientProject
          mkdir SpatialClientProject
          tar -xzf SpatialClientProject.tar.gz -C SpatialClientProject --strip-components=1

      - name: Build
        working-directory: SpatialClientProject
        run: gradle clean build --stacktrace --no-daemon

      - name: Verify output
        working-directory: SpatialClientProject
        run: |
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
          find build/libs -maxdepth 1 -type f -name '*.jar' -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpatialClient-Forge-1.20.1
          path: SpatialClientProject/build/libs/*.jar
          if-no-files-found: error
