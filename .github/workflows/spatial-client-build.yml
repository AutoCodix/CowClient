name: Spatial Client Forge Build

on:
  push:
    branches:
      - spatial-forge-1.20.1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Prepare refined Spatial Client
        run: |
          rm -rf SpatialClientProject
          mkdir SpatialClientProject
          tar -xzf SpatialClientProject.tar.gz -C SpatialClientProject --strip-components=1
          cp spatial_refine/src/dev/spatialclient/client/*.java SpatialClientProject/src/main/java/dev/spatialclient/client/
          mkdir -p SpatialClientProject/src/main/java/dev/spatialclient/config
          cp spatial_refine/src/dev/spatialclient/config/SpatialConfig.java SpatialClientProject/src/main/java/dev/spatialclient/config/SpatialConfig.java
          mkdir -p SpatialClientProject/src/main/resources/assets/spatialclient/textures/gui
          cp spatial_refine/ui_font_regular.png SpatialClientProject/src/main/resources/assets/spatialclient/textures/gui/ui_font_regular.png
          cp spatial_refine/ui_font_semibold.png SpatialClientProject/src/main/resources/assets/spatialclient/textures/gui/ui_font_semibold.png

      - name: Build
        working-directory: SpatialClientProject
        run: gradle clean build --stacktrace --no-daemon --console=plain

      - name: Verify output
        working-directory: SpatialClientProject
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'dev/spatialclient/client/SpatialMenuScreen.class'
          jar tf "$JAR" | grep -q 'dev/spatialclient/client/UiFont.class'
          jar tf "$JAR" | grep -q 'dev/spatialclient/client/UiRenderer.class'
          jar tf "$JAR" | grep -q 'dev/spatialclient/client/AuraRenderer.class'
          jar tf "$JAR" | grep -q 'assets/spatialclient/textures/gui/ui_font_regular.png'
          jar tf "$JAR" | grep -q 'assets/spatialclient/textures/gui/ui_font_semibold.png'
          echo "$JAR"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpatialClient-Forge-1.20.1-Deep-Custom
          path: SpatialClientProject/build/libs/*.jar
          if-no-files-found: error
